; Library-neutral benchmark config: Ryan-Reach-SO-ARM101-Normalized with
; 4 minibatches and entropy 0.01, which skrl/rl_games' adaptive-LR rules can
; handle (at 16 minibatches their lr collapses). Keep the rest in sync with
; Ryan-Reach-SO-ARM101-Normalized.ini and the tasks-isaaclab *_matched agents.
[train]
max_iterations = 20000
learning_rate = 0.001
max_lr = 0.001
min_lr = 5e-07
entropy_coef = 0.01
clip_epsilon = 0.2
desired_kl = 0.008
gamma = 0.99
num_mini_batches = 4
