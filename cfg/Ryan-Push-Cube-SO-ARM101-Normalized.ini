[train]
max_iterations = 20000
learning_rate = 0.0005
max_lr = 0.0005
min_lr = 5e-07
; 0.0005, not 0.005. Measured 2026-09-04: the policy's action std sat at exactly
; std_max on all four joints -- it was pushing against the ceiling, so the entropy
; bonus was beating the advantage signal. Since raw +/-1 IS the full joint range,
; a std of 1.0 means the exploration noise alone spans the whole range every step,
; which is the bang-bang. This is the cause; a reward penalty on saturation is not
; the fix (tried, cost -3172 of a ~200 return and diverged).
entropy_coef = 0.0005
; hard backstop on action noise, in the [train] section where TrainConfig reads
; it. raw +/-1 is the full joint range, so the 1.0 default lets a single
; exploration sample traverse the entire range in one step.
std_max = 0.4
clip_epsilon = 0.2
desired_kl = 0.008
; 0.999, not 0.99. The goal reward is progress-based, so its episode total is
; time-independent by construction -- but discounting reintroduces the rush
; through the back door: at 0.99 the effective horizon is 100 steps against a
; 600-step episode, so the same total collected at step 26 rather than step 300
; is worth 0.77 vs 0.049, a 15x preference for slamming. At 0.999 the horizon
; (1000) exceeds the episode and that ratio falls to 1.31x, which the speed
; penalties can actually outweigh. Raising this is what makes the progress
; reward do its job; without it the reward change alone changes little.
gamma = 0.999

[policy]
hidden_dims = 256,128,64
