[train]
max_iterations = 20000
learning_rate = 0.0005
max_lr = 0.0005
min_lr = 5e-07
; 0.002, 4x the cube push's 0.0005. The cube's value came from a 10k A/B
; (2026-09-10) that validated it at 91% / 0.82 cm, but it was chosen to stop
; bang-bang on a task that only had to discover shoving. This one also has to
; discover coming around the block and pushing off the bar to spin it, and the
; first 10k run at 0.0005 (kkh9y0bf) converged early and stopped improving:
; full-pose success went 24.8% at 4k to only 28.0% at 10k, while entropy fell to
; -12.5 -- sigma ~0.011 of a raw range where +/-1 is the whole joint travel, i.e.
; the policy had stopped exploring long before it had solved anything. Rebalancing
; the reward weights instead was tried and made it worse on both halves (see the
; task cfg), so exploration, not weighting, is the live hypothesis.
entropy_coef = 0.002
; hard backstop on action noise. raw +/-1 is the full joint range, so the 1.0
; default lets a single exploration sample traverse the entire range in one step.
std_max = 0.4
clip_epsilon = 0.2
desired_kl = 0.008
; 0.999, not 0.99. Both goal rewards here are progress-based, so their episode
; totals are time-independent by construction -- but discounting reintroduces the
; rush through the back door: at 0.99 the effective horizon is 100 steps against a
; 600-step episode, so the same total collected at step 26 rather than step 300 is
; worth 15x more. At 0.999 the horizon (1000) exceeds the episode and that ratio
; falls to 1.31x, which the speed penalties can actually outweigh. This matters
; more here than on the cube, not less: a rushed re-orientation is a spin.
gamma = 0.999

[policy]
hidden_dims = 256,128,64
